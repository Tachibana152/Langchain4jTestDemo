<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LangChain4j AI 助手</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23ff4d88'/%3E%3Ctext x='50' y='70' font-size='52' text-anchor='middle' fill='white' font-family='Arial, sans-serif' font-weight='bold'%3EAI%3C/text%3E%3C/svg%3E"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #fff5f8;
        --panel: #ffeef3;
        --border: #f3d3de;
        --text: #4a2b38;
        --text-dim: #a37085;
        --accent: #ff4d88;
        --accent-hover: #e63d78;
        --user-bubble: #ffd9e5;
        --ai-bubble: #ffffff;
        --danger: #e5484d;
        --radius: 12px;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family:
          "Segoe UI",
          "PingFang SC",
          "Microsoft YaHei",
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 24px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }

      .logo {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: linear-gradient(135deg, #ff5c8a, #ff9ecb);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: 700;
        color: #fff;
      }

      header h1 {
        font-size: 17px;
        font-weight: 600;
      }

      header .subtitle {
        font-size: 12px;
        color: var(--text-dim);
      }

      #chatMessages {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        scroll-behavior: smooth;
      }

      .welcome {
        text-align: center;
        color: var(--text-dim);
        margin: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .welcome .icon {
        font-size: 42px;
      }

      .welcome p {
        font-size: 14px;
      }

      .message {
        display: flex;
        gap: 12px;
        max-width: 78%;
        align-items: flex-start;
        animation: fadeIn 0.25s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message.user {
        align-self: flex-end;
        flex-direction: row-reverse;
      }

      .message .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 600;
      }

      .message.user .avatar {
        background: var(--accent);
        color: #fff;
      }

      .message.ai .avatar {
        background: linear-gradient(135deg, #ff5c8a, #ff9ecb);
        color: #fff;
      }

      .bubble {
        padding: 12px 16px;
        border-radius: var(--radius);
        font-size: 14px;
        line-height: 1.65;
        word-break: break-word;
        white-space: pre-wrap;
      }

      .message.user .bubble {
        background: var(--user-bubble);
        border-top-right-radius: 4px;
      }

      .message.ai .bubble {
        background: var(--ai-bubble);
        border: 1px solid var(--border);
        border-top-left-radius: 4px;
      }

      .bubble pre {
        background: #fdf1f6;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        overflow-x: auto;
        margin: 8px 0;
        font-family: "Cascadia Code", Consolas, monospace;
        font-size: 13px;
        line-height: 1.5;
      }

      .bubble code {
        background: #fdf1f6;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 5px;
        font-family: "Cascadia Code", Consolas, monospace;
        font-size: 12.5px;
      }

      .bubble pre code {
        border: none;
        padding: 0;
        background: none;
      }

      .bubble strong {
        font-weight: 600;
      }

      .typing .bubble {
        display: flex;
        gap: 5px;
        align-items: center;
        padding: 16px;
      }

      .typing .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--text-dim);
        animation: bounce 1.2s infinite;
      }

      .typing .dot:nth-child(2) {
        animation-delay: 0.15s;
      }
      .typing .dot:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes bounce {
        0%,
        60%,
        100% {
          transform: translateY(0);
          opacity: 0.5;
        }
        30% {
          transform: translateY(-5px);
          opacity: 1;
        }
      }

      .error .bubble {
        border-color: var(--danger);
        color: var(--danger);
      }

      footer {
        padding: 16px 24px 20px;
        background: var(--panel);
        border-top: 1px solid var(--border);
        flex-shrink: 0;
      }

      .input-area {
        display: flex;
        gap: 10px;
        align-items: flex-end;
        max-width: 860px;
        margin: 0 auto;
      }

      textarea {
        flex: 1;
        resize: none;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text);
        padding: 13px 16px;
        font-size: 14px;
        font-family: inherit;
        line-height: 1.5;
        max-height: 160px;
        min-height: 48px;
        outline: none;
        transition: border-color 0.2s;
      }

      textarea:focus {
        border-color: var(--accent);
      }

      textarea::placeholder {
        color: var(--text-dim);
      }

      button {
        background: var(--accent);
        border: none;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        padding: 13px 22px;
        border-radius: var(--radius);
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.1s;
        flex-shrink: 0;
      }

      button:hover:not(:disabled) {
        background: var(--accent-hover);
      }

      button:active:not(:disabled) {
        transform: scale(0.97);
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      /* 滚动条 */
      #chatMessages::-webkit-scrollbar {
        width: 8px;
      }
      #chatMessages::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }
      #chatMessages::-webkit-scrollbar-track {
        background: transparent;
      }

      .header-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .btn-secondary {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-dim);
        padding: 7px 14px;
        font-size: 13px;
        border-radius: 8px;
        transition:
          color 0.2s,
          border-color 0.2s,
          background 0.2s;
      }

      .btn-secondary:hover:not(:disabled) {
        color: var(--text);
        border-color: var(--accent);
        background: rgba(255, 77, 136, 0.08);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">AI</div>
      <div>
        <h1>LangChain4j 智能助手</h1>
        <div class="subtitle">基于 DeepSeek · 由 Spring Boot 提供接口</div>
      </div>
      <div class="header-right">
        <button
          id="newChatBtn"
          class="btn-secondary"
          title="清空当前会话记忆，开始新对话"
        >
          ✨ 新会话
        </button>
      </div>
    </header>

    <main id="chatMessages">
      <div class="welcome" id="welcome">
        <div class="icon">💬</div>
        <p>你好！我是基于 LangChain4j + DeepSeek 的智能助手</p>
        <p>有什么想问的，尽管告诉我吧～</p>
      </div>
    </main>

    <footer>
      <div class="input-area">
        <textarea
          id="input"
          rows="1"
          placeholder="输入你的问题，按 Enter 发送，Shift+Enter 换行..."
        ></textarea>
        <button id="sendBtn">发送</button>
      </div>
    </footer>

    <script>
      const chatMessages = document.getElementById("chatMessages");
      const input = document.getElementById("input");
      const sendBtn = document.getElementById("sendBtn");
      const welcome = document.getElementById("welcome");
      const newChatBtn = document.getElementById("newChatBtn");

      let sending = false;

      // ---------- 会话管理 ----------
      // 会话 ID 持久化到 localStorage，刷新页面后上下文记忆不丢失
      const SESSION_KEY = "langchain4j_session_id";
      let sessionId = localStorage.getItem(SESSION_KEY) || generateSessionId();

      function generateSessionId() {
        const id =
          (crypto.randomUUID && crypto.randomUUID()) ||
          "s-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10);
        localStorage.setItem(SESSION_KEY, id);
        return id;
      }

      // 新建会话：更换 sessionId，后端将为新会话创建独立的空白记忆
      newChatBtn.addEventListener("click", () => {
        sessionId = generateSessionId();
        chatMessages.querySelectorAll(".message").forEach((m) => m.remove());
        welcome.style.display = "";
        input.focus();
      });

      // 自动调整输入框高度
      input.addEventListener("input", () => {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 160) + "px";
      });

      // 发送（回车发送 / Shift+Enter 换行）
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });

      sendBtn.addEventListener("click", send);

      function send() {
        const message = input.value.trim();
        if (!message || sending) return;

        welcome.style.display = "none";
        addMessage("user", message);
        input.value = "";
        input.style.height = "auto";

        sending = true;
        sendBtn.disabled = true;
        const typing = addTyping();

        // 用 SSE 流式接收 AI 回复，实现打字机效果
        const es = new EventSource(
          `/chat/stream?message=${encodeURIComponent(message)}&sessionId=${encodeURIComponent(sessionId)}`,
        );

        let fullText = "";
        let done = false;

        const finish = () => {
          if (done) return;
          done = true;
          typing.remove();
          // 完成后渲染一次完整 Markdown，让代码块等格式正确显示
          addMessage("ai", fullText);
          sending = false;
          sendBtn.disabled = false;
          input.focus();
        };

        es.onmessage = (e) => {
          const data = e.data;

          if (data === "[DONE]") {
            es.close();
            finish();
            return;
          }

          // 后端错误：JSON {"error":"..."}
          if (data.startsWith("{")) {
            es.close();
            typing.remove();
            try {
              const obj = JSON.parse(data);
              addMessage("ai", `❌ ${obj.error || "请求失败"}`, true);
            } catch {
              addMessage("ai", `❌ ${data}`, true);
            }
            sending = false;
            sendBtn.disabled = false;
            input.focus();
            return;
          }

          // 正常 token：先以纯文本增量显示（性能好），结束后统一渲染 Markdown
          fullText += data;
          const bubble = typing.querySelector(".bubble");
          bubble.textContent = fullText;
          scrollToBottom();
        };

        es.onerror = () => {
          es.close();
          if (!done && fullText) {
            // 收到过内容但连接中断，尝试保留已生成部分
            finish();
          } else if (!done) {
            typing.remove();
            addMessage(
              "ai",
              "❌ 网络异常，无法连接服务器，请确认后端服务已启动。",
              true,
            );
            sending = false;
            sendBtn.disabled = false;
            input.focus();
          }
        };
      }

      function addMessage(role, text, isError = false) {
        const msg = document.createElement("div");
        msg.className = `message ${role}${isError ? " error" : ""}`;

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = role === "user" ? "我" : "AI";

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.innerHTML = renderMarkdown(text);

        msg.appendChild(avatar);
        msg.appendChild(bubble);
        chatMessages.appendChild(msg);
        scrollToBottom();
        return msg;
      }

      function addTyping() {
        const msg = document.createElement("div");
        msg.className = "message ai typing";

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = "AI";

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.innerHTML =
          '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';

        msg.appendChild(avatar);
        msg.appendChild(bubble);
        chatMessages.appendChild(msg);
        scrollToBottom();
        return msg;
      }

      function scrollToBottom() {
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      /**
       * 极简 Markdown 渲染：
       * - 代码块 ```lang ... ```
       * - 行内代码 `code`
       * - 加粗 **text**
       * - 换行
       */
      function renderMarkdown(text) {
        const escaped = escapeHtml(text);

        // 先提取代码块，避免内部被二次处理
        const codeBlocks = [];
        const withBlocks = escaped.replace(
          /```(\w*)\n?([\s\S]*?)```/g,
          (_, lang, code) => {
            codeBlocks.push(`<pre><code>${code}</code></pre>`);
            return `\u0000${codeBlocks.length - 1}\u0000`;
          },
        );

        const withInline = withBlocks
          .replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");

        return withInline.replace(
          /\u0000(\d+)\u0000/g,
          (_, i) => codeBlocks[Number(i)],
        );
      }

      function escapeHtml(str) {
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      // 初始聚焦
      input.focus();
    </script>
  </body>
</html>
