langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: ${deepseek-key-copilot}
      model-name: deepseek-v4-pro
      # 模型温度：越高回答越有创造性，越低越严谨
      temperature: 0.7
      # 单次回复最大 token 数
      max-tokens: 2048
      # 请求超时时间（秒）
      timeout: 60s
      # 打印请求/响应日志，方便调试（生产环境建议关闭）
      log-requests: true
      log-responses: true
    # 流式对话模型（SSE 打字机效果），参数与 chat-model 保持一致
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${deepseek-key-copilot}
      model-name: deepseek-v4-pro
      temperature: 0.7
      max-tokens: 2048
      timeout: 60s
      log-requests: false
      log-responses: false
spring:
  data:
    redis:
      # 连接地址
      host: 192.168.184.128
      # 端口
      port: 6379
      # 数据库
      database: 1
      # 用户名，如果有
      # username:
      password: "07210721"
      # 连接超时
      connect-timeout: 5s
      # 读超时
      timeout: 5s

      # Lettuce 客户端的配置
      lettuce:
        # 连接池配置
        pool:
          # 最小空闲连接
          min-idle: 0
          # 最大空闲连接
          max-idle: 8
          # 最大活跃连接
          max-active: 8
          # 从连接池获取连接 最大超时时间，小于等于0则表示不会超时
          max-wait: -1ms